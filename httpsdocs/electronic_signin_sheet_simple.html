
<style>
  .sig-canvas { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); cursor: crosshair; touch-action: none; display: block; }
  .clear-sig { font-size: 11px; color: var(--color-text-tertiary); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 2px 0; }
  .signed-badge { font-size: 11px; background: var(--color-background-success); color: var(--color-text-success); padding: 2px 8px; border-radius: var(--border-radius-md); display: none; }
  .entry-row { display: grid; grid-template-columns: 32px 1fr 260px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .entry-row input[type=text] { font-size: 14px; padding: 6px 8px; background: transparent; border: none; border-bottom: 0.5px solid var(--color-border-secondary); color: var(--color-text-primary); outline: none; width: 100%; box-sizing: border-box; }
  .entry-row input[type=text]:focus { border-bottom-color: var(--color-border-primary); }
  .sig-cell { display: flex; flex-direction: column; gap: 4px; }
  .sig-row { display: flex; align-items: center; gap: 8px; }
  .add-btn { font-size: 13px; padding: 7px 14px; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); background: none; color: var(--color-text-secondary); cursor: pointer; margin-top: 12px; }
  .add-btn:hover { background: var(--color-background-secondary); }
  .remove-btn { font-size: 16px; background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); padding: 0; line-height: 1; }
  .remove-btn:hover { color: var(--color-text-primary); }
</style>

<h2 class="sr-only">Electronic sign-in sheet with topic, date, name and signature</h2>

<div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.75rem;">
    <div style="flex: 1; margin-right: 2rem;">
      <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;">Topic</div>
      <input id="sheet-topic" type="text" placeholder="Enter topic..." style="font-size: 20px; font-weight: 500; border: none; outline: none; background: transparent; color: var(--color-text-primary); width: 100%; border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 4px;" />
    </div>
    <div style="text-align: right; flex-shrink: 0;">
      <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;">Date</div>
      <input id="sheet-date" type="date" style="font-size: 14px; border: none; outline: none; background: transparent; color: var(--color-text-primary); text-align: right;" />
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 32px 1fr 260px; gap: 12px; padding-bottom: 8px; border-bottom: 0.5px solid var(--color-border-primary);">
    <div style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">#</div>
    <div style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">Name</div>
    <div style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500;">Signature</div>
  </div>

  <div id="entries-area"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
    <button class="add-btn" onclick="addEntry()">+ Add row</button>
    <button style="font-size: 13px; padding: 7px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: none; cursor: pointer; color: var(--color-text-primary);" onclick="exportSheet()">Export as HTML</button>
  </div>

</div>

<script>
let entries = [];
let entryId = 0;

document.getElementById('sheet-date').value = new Date().toISOString().split('T')[0];

function addEntry() {
  const id = ++entryId;
  entries.push(id);
  const area = document.getElementById('entries-area');
  const row = document.createElement('div');
  row.className = 'entry-row';
  row.id = 'entry-' + id;
  row.innerHTML = `
    <span style="font-size: 13px; color: var(--color-text-tertiary);" id="num-${id}"></span>
    <div style="display:flex; align-items:center; gap:6px;">
      <input type="text" placeholder="Full name" id="name-${id}" />
      <button class="remove-btn" onclick="removeEntry(${id})">×</button>
    </div>
    <div class="sig-cell">
      <div class="sig-row">
        <canvas class="sig-canvas" id="canvas-${id}" width="200" height="48"></canvas>
        <button class="clear-sig" onclick="clearCanvas(${id})">Clear</button>
        <span class="signed-badge" id="badge-${id}">✓</span>
      </div>
    </div>
  `;
  area.appendChild(row);
  initCanvas(id);
  reNumber();
}

function removeEntry(id) {
  const el = document.getElementById('entry-' + id);
  if (el) el.remove();
  entries = entries.filter(e => e !== id);
  reNumber();
}

function reNumber() {
  entries.forEach((id, i) => {
    const el = document.getElementById('num-' + id);
    if (el) el.textContent = i + 1;
  });
}

function clearCanvas(id) {
  const canvas = document.getElementById('canvas-' + id);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('badge-' + id).style.display = 'none';
}

function initCanvas(id) {
  const canvas = document.getElementById('canvas-' + id);
  const ctx = canvas.getContext('2d');
  let drawing = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e) {
    if (!drawing) return; e.preventDefault();
    const p = getPos(e);
    ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-text-primary') || '#111';
    ctx.lineTo(p.x, p.y); ctx.stroke();
    document.getElementById('badge-' + id).style.display = 'inline';
  }
  function stop() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', stop);
  canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', stop);
}

function exportSheet() {
  const topic = document.getElementById('sheet-topic').value || 'Sign-In Sheet';
  const date = document.getElementById('sheet-date').value;
  let rows = '';
  entries.forEach((id, i) => {
    const name = (document.getElementById('name-' + id) || {}).value || '';
    const canvas = document.getElementById('canvas-' + id);
    const sig = canvas ? canvas.toDataURL() : '';
    rows += `<tr>
      <td style="padding:10px 14px; border-bottom:1px solid #eee; color:#999;">${i+1}</td>
      <td style="padding:10px 14px; border-bottom:1px solid #eee;">${name}</td>
      <td style="padding:10px 14px; border-bottom:1px solid #eee;"><img src="${sig}" style="height:40px;" /></td>
    </tr>`;
  });
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${topic}</title></head><body style="font-family:sans-serif;max-width:760px;margin:48px auto;padding:24px;">
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;">
  <h1 style="font-size:22px;font-weight:500;margin:0;">${topic}</h1>
  <span style="font-size:14px;color:#888;">${date}</span>
</div>
<table style="width:100%;border-collapse:collapse;font-size:14px;">
<thead><tr style="border-bottom:2px solid #ddd;">
  <th style="padding:8px 14px;text-align:left;font-weight:500;width:36px;">#</th>
  <th style="padding:8px 14px;text-align:left;font-weight:500;">Name</th>
  <th style="padding:8px 14px;text-align:left;font-weight:500;">Signature</th>
</tr></thead><tbody>${rows}</tbody></table>
<p style="color:#bbb;font-size:11px;margin-top:40px;">Generated ${new Date().toLocaleString()}</p>
</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = topic.replace(/\s+/g,'_') + '.html'; a.click();
}

addEntry(); addEntry(); addEntry();
</script>
